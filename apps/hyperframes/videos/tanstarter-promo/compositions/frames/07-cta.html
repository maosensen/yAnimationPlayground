  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="07-cta"]');
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["07-cta"] = tl;

      const phraseNodes = Array.from(root.querySelectorAll("[data-f07-cta-phrase]"));
      const ruleNodes = Array.from(root.querySelectorAll("[data-f07-cta-rule]"));
      const phraseContent = ["少写脚手架", "直接写", "产品"];
      const phraseRawDurations = phraseContent.map((text) => 0.18 + text.length * 0.035);
      const phraseTotal = phraseRawDurations.reduce((sum, duration) => sum + duration, 0);
      let phraseCursor = 0.04;
      const phraseTimeline = phraseRawDurations.map((duration) => {
        const scaledDuration = (duration / phraseTotal) * 0.86;
        const entry = { start: phraseCursor, duration: scaledDuration };
        phraseCursor += scaledDuration;
        return entry;
      });

      phraseTimeline.forEach((entry, index) => {
        tl.fromTo(
          phraseNodes[index],
          { x: -145, opacity: 0 },
          { x: 0, opacity: 1, duration: entry.duration, ease: "power2.out" },
          entry.start,
        );
        if (ruleNodes[index]) {
          tl.fromTo(
            ruleNodes[index],
            { scaleX: 0, opacity: 0 },
            { scaleX: 1, opacity: 1, duration: 0.18, ease: "power1.out" },
            entry.start + entry.duration * 0.68,
          );
        }
      });

      tl.fromTo(
        root.querySelector("[data-f07-cta-card]"),
        {
          scale: 0.16,
          borderRadius: 320,
          backgroundColor: "#252320",
          boxShadow: "0 0 0 rgba(10, 10, 10, 0)",
        },
        {
          scale: 1,
          borderRadius: 66,
          backgroundColor: "#181715",
          boxShadow: "0 1px 3px rgba(10, 10, 10, 0.08), 0 4px 16px rgba(10, 10, 10, 0.04)",
          duration: 0.75,
          ease: "power2.inOut",
        },
        1.6,
      );
      tl.fromTo(
        root.querySelector("[data-f07-cta-old]"),
        { opacity: 1 },
        { opacity: 0, duration: 0.3, ease: "power1.in" },
        1.6,
      );
      tl.fromTo(
        root.querySelector("[data-f07-cta-new]"),
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power1.out" },
        2.05,
      );

      tl.fromTo(
        root.querySelector("[data-f07-cta-brand]"),
        { y: 34, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.52, ease: "power2.out" },
        2.72,
      );
      tl.fromTo(
        root.querySelector("[data-f07-cta-index]"),
        { x: 28, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.38, ease: "power1.out" },
        2.96,
      );

      const commandEl = root.querySelector("#frame-f07-cta-command");
      const cursorEl = root.querySelector("#frame-f07-cta-cursor");
      const sequence = [
        { t: 0, text: "", segment: "main", color: "#FFFFFF" },
        { t: 0.56, text: "p", segment: "main", color: "#FFFFFF" },
        { t: 0.67, text: "pnpm", segment: "main", color: "#FFFFFF" },
        { t: 0.81, text: "pnpm cr", segment: "main", color: "#FFFFFF" },
        { t: 0.94, text: "pnpm create", segment: "main", color: "#FFFFFF" },
        { t: 1.08, text: "pnpm create ", segment: "package", color: "#F0B100" },
        { t: 1.2, text: "pnpm create mug", segment: "package", color: "#F0B100" },
        { t: 1.34, text: "pnpm create mugnav", segment: "package", color: "#F0B100" },
        { t: 1.5, text: "pnpm create mugnavo", segment: "package", color: "#F0B100" },
      ];
      const changeTimes = sequence
        .filter((entry, index) => index > 0 && entry.text !== sequence[index - 1].text)
        .map((entry) => entry.t);
      const entryAt = (time) => {
        for (let index = sequence.length - 1; index >= 0; index -= 1) {
          if (time >= sequence[index].t) return sequence[index];
        }
        return sequence[0];
      };
      const commandDriver = { t: 0 };
      const commandDuration = 2.6;
      let lastCommandText = null;
      tl.to(
        commandDriver,
        {
          t: commandDuration,
          duration: commandDuration,
          ease: "none",
          onUpdate: () => {
            const entry = entryAt(commandDriver.t);
            if (entry.text !== lastCommandText) {
              commandEl.textContent = entry.text;
              lastCommandText = entry.text;
            }
            cursorEl.style.background = entry.color;
            const isTyping = changeTimes.some(
              (changeTime) => changeTime <= commandDriver.t && commandDriver.t - changeTime < 0.09,
            );
            const blinkPhase = (commandDriver.t / commandDuration) * Math.PI * 2 * 4;
            cursorEl.style.opacity = isTyping || Math.sin(blinkPhase) > 0 ? "1" : "0";
          },
        },
        1.6,
      );
    })();
  </script>
