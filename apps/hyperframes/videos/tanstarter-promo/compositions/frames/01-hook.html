  <div data-hf-id="hf-6nlu" id="root" data-composition-id="01-hook" data-width="1920" data-height="1080" data-duration="4.2">

    <div data-hf-id="hf-5r8s" id="f01-hook-content" class="clip" data-start="0" data-duration="4.2" data-track-index="1">
      <div data-hf-id="hf-r2jw" id="f01-hook-panel" data-layout-allow-overflow="">
        <div data-hf-id="hf-c9xy" id="f01-hook-motion-wrapper" data-layout-allow-overflow="">
          <div data-hf-id="hf-ppci" id="f01-hook-slot-wrap">
            <div data-hf-id="hf-iq1k" id="f01-hook-word-slot">AUTH</div>

          <div data-hf-id="hf-lcr1" id="f01-hook-word-rail" aria-hidden="true">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      const frameId = "01-hook";
      const duration = 4.2;
      const pulse = 0.04;

      const beatSteps = [0, 20, 32, 44, 55, 60, 76, 90];
      const beats = beatSteps.map((step) => step * pulse);

      const prepContent = [
        { title: "AUTH", hold: 0.6 },
        { title: "ROUTES", hold: 0.26 },
        { title: "DATABASE", hold: 0.24 },
        { title: "TOOLING", hold: 0.21 },
      ];
      const baseDuration = 0.16;
      const secondsPerCharacter = 0.01;
      let cumulative = 0;
      const prepTimeline = prepContent.map((entry) => {
        const itemDuration =
          baseDuration + entry.title.length * secondsPerCharacter + entry.hold;
        const start = cumulative;
        cumulative += itemDuration;
        return { ...entry, start, end: cumulative };
      });

      const primarySequence = [
        { t: 0, text: "" },
        { t: beats[5], text: "PRODUCT FIRST" },
        { t: beats[7], text: "" },
      ];
      const claimSequence = [
        { t: 0, text: "" },
        { t: beats[6], text: "SKIP THE SETUP" },
        { t: 3.28, text: "START WITH PRODUCT CODE" },
      ];

      const stateAt = (sequence, time) => {
        for (let index = sequence.length - 1; index >= 0; index -= 1) {
          if (time >= sequence[index].t) return sequence[index];
        }
        return sequence[0];
      };

      const prepAt = (time) => {
        for (let index = prepTimeline.length - 1; index >= 0; index -= 1) {
          if (time >= prepTimeline[index].start) return prepTimeline[index];
        }
        return prepTimeline[0];
      };

      const wordSlot = document.getElementById("f01-hook-word-slot");
      const wordRail = document.getElementById("f01-hook-word-rail");
      const primaryClaim = document.getElementById("f01-hook-claim-primary");
      const claimRow = document.getElementById("f01-hook-claim-row");
      const claimCopy = document.getElementById("f01-hook-claim-copy");
      const period = document.getElementById("f01-hook-period");
      const motionWrapper = document.getElementById("f01-hook-motion-wrapper");
      const ticks = Array.from(document.querySelectorAll("[data-f01-hook-tick]"));

      const tl = gsap.timeline({ paused: true });

      gsap.set(
        wordSlot,
        { opacity: 1, x: 0, y: 0, scale: 1, rotation: 0, filter: "blur(0px)" },
      );
      gsap.set(wordRail, { opacity: 0, x: 0 });
      gsap.set(primaryClaim, { opacity: 0, x: 230 });
      gsap.set(claimRow, { opacity: 0, x: 90 });
      gsap.set(period, { opacity: 0, scale: 0.92 });
      gsap.set(motionWrapper, { x: 0 });

      const stateDriver = { t: 0 };
      let lastPrep = "AUTH";
      let lastPrimary = "";
      let lastClaim = "";

      tl.to(
        stateDriver,
        {
          t: duration,
          duration,
          ease: "none",
          onUpdate: () => {
            const prep = prepAt(stateDriver.t).title;
            if (prep !== lastPrep) {
              wordSlot.textContent = prep;
              lastPrep = prep;
            }

            const primary = stateAt(primarySequence, stateDriver.t).text;
            if (primary !== lastPrimary) {
              primaryClaim.textContent = primary;
              lastPrimary = primary;
            }

            const claim = stateAt(claimSequence, stateDriver.t).text;
            if (claim !== lastClaim) {
              claimCopy.textContent = claim;
              lastClaim = claim;
            }
          },
        },
        0,
      );

      tl.fromTo(
        wordSlot,
        { scale: 1.34, opacity: 0, filter: "blur(10px)" },
        {
          scale: 1,
          opacity: 1,
          filter: "blur(0px)",
          duration: 0.36,
          ease: "power4.out",
        },
        beats[1],
      );
      tl.fromTo(
        wordSlot,
        { x: 230, opacity: 0, filter: "blur(0px)" },
        { x: 0, opacity: 1, duration: 0.36, ease: "expo.out" },
        beats[2],
      );
      tl.fromTo(
        wordSlot,
        { y: 70, rotation: 2.5, opacity: 0 },
        {
          y: 0,
          rotation: 0,
          opacity: 1,
          duration: 0.4,
          ease: "circ.out",
        },
        beats[3],
      );

      tl.set(wordSlot, { opacity: 0 }, beats[4]);
      tl.set(wordRail, { opacity: 1, x: 0 }, beats[4]);
      tl.to(
        wordRail,
        { x: -230, duration: 0.3, ease: "power4.in" },
        beats[4],
      );
      tl.to(
        wordRail,
        { opacity: 0, duration: 0.18, ease: "power1.in" },
        beats[4],
      );

      tl.fromTo(
        primaryClaim,
        { x: 230, opacity: 0.35 },
        { x: 0, opacity: 1, duration: 0.3, ease: "power4.out" },
        beats[5],
      );
      tl.fromTo(
        claimRow,
        { x: 90, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.36, ease: "expo.out" },
        beats[6],
      );

      tl.set(primaryClaim, { opacity: 0 }, beats[7]);
      tl.fromTo(
        period,
        { opacity: 0, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 0.24, ease: "power2.out" },
        beats[7],
      );
      tl.to(
        motionWrapper,
        { x: -56, duration: duration - beats[7], ease: "power3.in" },
        beats[7],
      );

      ticks.forEach((tick, index) => {
        const beat = beats[index];
        tl.to(
          tick,
          { opacity: 0.72, scaleY: 2.1, duration: 0.08, ease: "power2.out" },
          beat,
        );
        tl.to(
          tick,
          { opacity: 0.18, scaleY: 1, duration: 0.14, ease: "power2.in" },
          beat + 0.08,
        );
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[frameId] = tl;
    })();
  </script>
