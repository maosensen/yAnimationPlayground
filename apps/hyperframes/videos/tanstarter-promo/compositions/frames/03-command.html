  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};

    const tl = gsap.timeline({ paused: true });
    window.__timelines["03-command"] = tl;

    const commandText = document.getElementById("f03-command-text");
    const commandCursor = document.getElementById("f03-command-cursor");

    const COMMAND_SEQUENCE = [
      { t: 0, text: "", segment: "main", color: "#FFFFFF" },
      { t: 0.08, text: "p", segment: "main", color: "#FFFFFF" },
      { t: 0.16, text: "pn", segment: "main", color: "#FFFFFF" },
      { t: 0.24, text: "pnp", segment: "main", color: "#FFFFFF" },
      { t: 0.32, text: "pnpm", segment: "main", color: "#FFFFFF" },
      { t: 0.45, text: "pnpm ", segment: "main", color: "#FFFFFF" },
      { t: 0.53, text: "pnpm c", segment: "create", color: "#5DB8A6" },
      { t: 0.61, text: "pnpm cr", segment: "create", color: "#5DB8A6" },
      { t: 0.69, text: "pnpm cre", segment: "create", color: "#5DB8A6" },
      { t: 0.77, text: "pnpm crea", segment: "create", color: "#5DB8A6" },
      { t: 0.85, text: "pnpm creat", segment: "create", color: "#5DB8A6" },
      { t: 0.93, text: "pnpm create", segment: "create", color: "#5DB8A6" },
      { t: 1.06, text: "pnpm create ", segment: "create", color: "#5DB8A6" },
      { t: 1.15, text: "pnpm create m", segment: "brand", color: "#E8A55A" },
      { t: 1.23, text: "pnpm create mu", segment: "brand", color: "#E8A55A" },
      { t: 1.31, text: "pnpm create mug", segment: "brand", color: "#E8A55A" },
      { t: 1.39, text: "pnpm create mugn", segment: "brand", color: "#E8A55A" },
      { t: 1.47, text: "pnpm create mugna", segment: "brand", color: "#E8A55A" },
      { t: 1.55, text: "pnpm create mugnav", segment: "brand", color: "#E8A55A" },
      { t: 1.63, text: "pnpm create mugnavo", segment: "brand", color: "#E8A55A" },
      { t: 1.7, text: "pnpm create mugnavo", segment: "submit", color: "#5DB872" },
    ];

    function commandEntryAt(time) {
      for (let index = COMMAND_SEQUENCE.length - 1; index >= 0; index -= 1) {
        if (time >= COMMAND_SEQUENCE[index].t) return COMMAND_SEQUENCE[index];
      }
      return COMMAND_SEQUENCE[0];
    }

    const COMMAND_CHANGE_TIMES = COMMAND_SEQUENCE.filter(
      (entry, index) => index > 0 && entry.text !== COMMAND_SEQUENCE[index - 1].text,
    ).map((entry) => entry.t);

    tl.fromTo(
      "[id='f03-command-terminal']",
      {
        scale: 0.84,
        clipPath: "inset(0 43% round 96px)",
        borderRadius: "96px",
        backgroundColor: "#1F1E1B",
        boxShadow: "0 0 0 rgba(10, 10, 10, 0)",
      },
      {
        scale: 1,
        clipPath: "inset(0 0% round 8px)",
        borderRadius: "8px",
        backgroundColor: "#181715",
        boxShadow:
          "0 1px 3px rgba(10, 10, 10, 0.08), 0 4px 16px rgba(10, 10, 10, 0.04)",
        duration: 0.9,
        ease: "power2.inOut",
      },
      0,
    );

    tl.fromTo(
      "[id='f03-command-terminal-chrome']",
      { opacity: 0 },
      { opacity: 1, duration: 0.36, ease: "power1.out" },
      0.54,
    );

    tl.fromTo(
      "[id='f03-command-kicker']",
      { opacity: 0, y: -8 },
      { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" },
      0.2,
    );

    const commandDriver = { t: 0 };
    tl.to(
      commandDriver,
      {
        t: 1.7,
        duration: 1.7,
        ease: "none",
        onUpdate: () => {
          const entry = commandEntryAt(commandDriver.t);
          commandText.textContent = entry.text;
          commandCursor.style.background = entry.color;
        },
      },
      0.9,
    );

    const cursorClock = { t: 0 };
    tl.to(
      cursorClock,
      {
        t: 3.4,
        duration: 3.4,
        ease: "none",
        onUpdate: () => {
          const localTypingTime = Math.min(cursorClock.t, 1.7);
          const isTyping = COMMAND_CHANGE_TIMES.some(
            (time) => time <= localTypingTime && localTypingTime - time < 0.07,
          );
          const blinkPhase = (cursorClock.t / 3.4) * Math.PI * 2 * 4;
          commandCursor.style.opacity =
            cursorClock.t >= 3.32 || isTyping || Math.sin(blinkPhase) > 0 ? "1" : "0";
        },
      },
      0.9,
    );

    tl.fromTo(
      "[id='f03-command-tree']",
      { opacity: 0, y: 24, scale: 0.985 },
      { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "power2.out" },
      2.5,
    );

    tl.fromTo(
      "[id='f03-command-project-root']",
      { opacity: 0, x: -18 },
      { opacity: 1, x: 0, duration: 0.36, ease: "power2.out" },
      2.54,
    );

    const MODULE_CONTENT = [
      {
        label: "React 19",
        card: document.getElementById("f03-command-module-react"),
        path: "f03-command-path-react",
        junction: document.getElementById("f03-command-junction-react"),
      },
      {
        label: "TanStack Start",
        card: document.getElementById("f03-command-module-start"),
        path: "f03-command-path-start",
        junction: document.getElementById("f03-command-junction-start"),
      },
      {
        label: "Router",
        card: document.getElementById("f03-command-module-router"),
        path: "f03-command-path-router",
        junction: document.getElementById("f03-command-junction-router"),
      },
      {
        label: "Query",
        card: document.getElementById("f03-command-module-query"),
        path: "f03-command-path-query",
        junction: document.getElementById("f03-command-junction-query"),
      },
    ];

    let moduleCursor = 2.64;
    const MODULE_TIMELINE = MODULE_CONTENT.map((entry) => {
      const duration = 0.32 + entry.label.length * 0.008;
      const start = moduleCursor;
      moduleCursor += duration;
      return { ...entry, start, end: moduleCursor };
    });

    MODULE_TIMELINE.forEach((entry) => {
      const path = document.getElementById(entry.path);
      const pathLength = path.getTotalLength();
      path.style.strokeDasharray = `${pathLength}`;

      tl.fromTo(
        path,
        { strokeDashoffset: pathLength },
        {
          strokeDashoffset: 0,
          duration: Math.min(0.5, entry.end - entry.start),
          ease: "power2.out",
        },
        entry.start,
      );

      tl.fromTo(
        entry.card,
        { opacity: 0, y: 18, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.34, ease: "power2.out" },
        entry.start + (entry.end - entry.start) * 0.42,
      );

      tl.fromTo(
        entry.junction,
        { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out" },
        entry.end - 0.1,
      );
    });

    tl.to(
      "[id='f03-command-project-root']",
      {
        backgroundColor: "#FFCED0",
        borderColor: "rgba(10, 10, 10, 0.28)",
        duration: 0.28,
        ease: "power1.out",
      },
      4.3,
    );

    tl.to(
      "[class~='f03-command-module']",
      {
        borderColor: "rgba(10, 10, 10, 0.28)",
        duration: 0.28,
        ease: "power1.out",
        stagger: 0.035,
      },
      4.3,
    );
  </script>
