  <script>
    window.__timelines = window.__timelines || {};

    const timeline = gsap.timeline({ paused: true });
    window.__timelines["06-cleanup"] = timeline;

    const pageImage = document.getElementById("f06-cleanup-page-image");
    const pageDimmer = document.getElementById("f06-cleanup-page-dimmer");
    const scrollThumb = document.getElementById("f06-cleanup-scroll-thumb");
    const cleanupCard = document.getElementById("f06-cleanup-card");
    const expandSheet = document.getElementById("f06-cleanup-expand-sheet");
    const below = document.getElementById("f06-cleanup-below");
    const tree = document.getElementById("f06-cleanup-tree");
    const productSlot = document.getElementById("f06-cleanup-product-slot");
    const productLabel = document.getElementById("f06-cleanup-product-label");

    timeline.fromTo(
      pageImage,
      { y: 0 },
      { y: -410, duration: 2.35, ease: "power3.out" },
      0.05,
    );
    timeline.fromTo(
      scrollThumb,
      { y: 0 },
      { y: 452, duration: 2.35, ease: "power3.out" },
      0.05,
    );

    timeline.fromTo(
      pageDimmer,
      { opacity: 0 },
      { opacity: 0.82, duration: 0.42, ease: "power1.inOut" },
      2.58,
    );
    timeline.fromTo(
      cleanupCard,
      { x: 697, y: 635, scale: 0.5, opacity: 0 },
      { x: 120, y: 145, scale: 1, opacity: 1, duration: 0.62, ease: "power3.out" },
      2.6,
    );
    timeline.fromTo(
      [expandSheet, below],
      { y: -360 },
      { y: 0, duration: 0.55, ease: "power3.out" },
      2.88,
    );

    const rowContents = [
      document.getElementById("f06-cleanup-row-1"),
      document.getElementById("f06-cleanup-row-2"),
      document.getElementById("f06-cleanup-row-3"),
    ];
    const rowGhosts = [
      document.getElementById("f06-cleanup-row-1-ghost"),
      document.getElementById("f06-cleanup-row-2-ghost"),
      document.getElementById("f06-cleanup-row-3-ghost"),
    ];

    timeline.fromTo(
      rowContents,
      { opacity: 0, y: 12 },
      { opacity: 1, y: 0, duration: 0.26, stagger: 0.07, ease: "power2.out" },
      3.12,
    );

    const CONTENT = [
      { label: "routes/demo-*", row: rowContents[0], ghost: rowGhosts[0] },
      { label: "components/demo-*", row: rowContents[1], ghost: rowGhosts[1] },
      { label: "data/demo-*", row: rowContents[2], ghost: rowGhosts[2] },
    ];
    const BASE_DURATION = 0.42;
    const SEC_PER_CHAR = 0.008;
    const HOLD = 0.05;
    const DELETE_WINDOW = 1.68;
    let cumulative = 0;
    const rawSequence = CONTENT.map((entry) => {
      const duration = BASE_DURATION + entry.label.length * SEC_PER_CHAR + HOLD;
      const start = cumulative;
      cumulative += duration;
      return { ...entry, start, duration };
    });
    const sequenceScale = DELETE_WINDOW / cumulative;
    const SEQUENCE = rawSequence.map((entry) => ({
      ...entry,
      start: entry.start * sequenceScale,
      duration: entry.duration * sequenceScale,
    }));

    SEQUENCE.forEach((entry) => {
      const start = 4.4 + entry.start;
      const rampDuration = entry.duration * 0.2;
      const burstDuration = entry.duration * 0.18;
      const tailDuration = entry.duration * 0.62;

      timeline.fromTo(
        entry.ghost,
        { opacity: 0 },
        { opacity: 1, duration: burstDuration, ease: "none" },
        start + rampDuration,
      );
      timeline.to(
        entry.row,
        { x: -46, duration: rampDuration, ease: "power3.in" },
        start,
      );
      timeline.to(
        entry.row,
        { x: -320, duration: burstDuration, ease: "none" },
        start + rampDuration,
      );
      timeline.to(
        entry.row,
        { x: -420, duration: tailDuration, ease: "power4.out" },
        start + rampDuration + burstDuration,
      );
      timeline.to(
        entry.row,
        { opacity: 0, duration: tailDuration * 0.58, ease: "power2.in" },
        start + rampDuration + burstDuration + tailDuration * 0.18,
      );
    });

    timeline.fromTo(
      tree,
      { y: 26, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.42, ease: "power3.out" },
      6.18,
    );
    timeline.fromTo(
      productSlot,
      { scaleX: 0.86, opacity: 0, transformOrigin: "0% 50%" },
      { scaleX: 1, opacity: 1, duration: 0.38, ease: "power3.out" },
      6.28,
    );
    timeline.fromTo(
      productLabel,
      { y: -28, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.34, ease: "power3.out" },
      6.38,
    );
  </script>
