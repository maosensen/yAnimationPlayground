  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      const compositionId = "05-toolchain";
      const byId = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });

      window.__timelines = window.__timelines || {};
      window.__timelines[compositionId] = tl;

      tl.fromTo(
        byId("f05-toolchain-heading"),
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.36, ease: "power2.out" },
        0,
      );

      [byId("f05-toolchain-shadcn"), byId("f05-toolchain-base-ui")].forEach((element, index) => {
        const targetX = Number(element.dataset.targetX);
        const targetY = Number(element.dataset.targetY);

        tl.fromTo(
          element,
          {
            xPercent: -50,
            yPercent: -50,
            x: targetX * 0.9,
            y: targetY + 24,
            scale: 0.94,
            opacity: 0,
          },
          {
            x: targetX,
            y: targetY,
            scale: 1,
            opacity: 1,
            duration: 0.88,
            ease: "power3.out",
          },
          0.18 + index * 0.08,
        );
      });

      [byId("f05-toolchain-vite"), byId("f05-toolchain-oxlint"), byId("f05-toolchain-oxfmt")].forEach(
        (element, index) => {
          const targetX = Number(element.dataset.targetX);
          const targetY = Number(element.dataset.targetY);

          tl.fromTo(
            element,
            {
              xPercent: -50,
              yPercent: -50,
              x: targetX,
              y: targetY + 18,
              scale: 0.97,
              opacity: 0,
            },
            {
              x: targetX,
              y: targetY,
              scale: 1,
              opacity: 1,
              duration: 0.58,
              ease: "power2.out",
            },
            1.42 + index * 0.72,
          );
        },
      );

      const routePaths = [
        byId("f05-toolchain-route-left"),
        byId("f05-toolchain-route-right"),
        byId("f05-toolchain-route-bridge"),
        byId("f05-toolchain-route-vite"),
        byId("f05-toolchain-route-oxlint"),
        byId("f05-toolchain-route-oxfmt"),
      ];

      routePaths.forEach((path) => {
        path.style.strokeDasharray = "100";
        path.style.strokeDashoffset = "100";
      });

      [
        byId("f05-toolchain-node-vite"),
        byId("f05-toolchain-node-oxlint"),
        byId("f05-toolchain-node-oxfmt"),
      ].forEach((element) => gsap.set(element, { opacity: 0, scale: 0.75, transformOrigin: "center" }));

      tl.to(
        [byId("f05-toolchain-route-left"), byId("f05-toolchain-route-right")],
        { strokeDashoffset: 0, duration: 0.62, ease: "power2.out", stagger: 0.08 },
        3.82,
      );
      tl.to(
        byId("f05-toolchain-route-bridge"),
        { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
        4.32,
      );

      [
        [byId("f05-toolchain-route-vite"), byId("f05-toolchain-node-vite")],
        [byId("f05-toolchain-route-oxlint"), byId("f05-toolchain-node-oxlint")],
        [byId("f05-toolchain-route-oxfmt"), byId("f05-toolchain-node-oxfmt")],
      ].forEach(([pathElement, nodeElement], index) => {
        const start = 4.62 + index * 0.58;
        tl.to(
          pathElement,
          { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
          start,
        );
        tl.to(
          nodeElement,
          { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out" },
          start + 0.38,
        );
      });

      tl.fromTo(
        byId("f05-toolchain-responsibility"),
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
        4.08,
      );

      const responsibilityContent = [
        { key: "vite", title: "Develop", body: "fast development", id: "f05-toolchain-vite" },
        { key: "oxlint", title: "Check", body: "static analysis", id: "f05-toolchain-oxlint" },
        { key: "oxfmt", title: "Format", body: "consistent output", id: "f05-toolchain-oxfmt" },
      ];
      const baseDuration = 0.38;
      const secondsPerCharacter = 0.018;
      const hold = 0.16;
      let cumulative = 0;
      const responsibilityTimeline = responsibilityContent.map((entry) => {
        const duration = baseDuration + entry.body.length * secondsPerCharacter + hold;
        const start = cumulative;
        cumulative += duration;
        return { ...entry, start, end: cumulative };
      });
      const responsibilityDriver = { t: 0 };
      const responsibilityText = byId("f05-toolchain-responsibility-text");
      let lastResponsibilityKey = "";

      function responsibilityAt(time) {
        for (let index = responsibilityTimeline.length - 1; index >= 0; index -= 1) {
          if (time >= responsibilityTimeline[index].start) return responsibilityTimeline[index];
        }
        return responsibilityTimeline[0];
      }

      tl.to(
        responsibilityDriver,
        {
          t: cumulative,
          duration: 2.25,
          ease: "none",
          onUpdate: () => {
            const entry = responsibilityAt(responsibilityDriver.t);
            if (entry.key !== lastResponsibilityKey) {
              responsibilityText.textContent = entry.title;
              responsibilityContent.forEach((item) => {
                byId(item.id).classList.toggle("f05-toolchain-is-active", item.key === entry.key);
              });
              lastResponsibilityKey = entry.key;
            }
          },
        },
        4.22,
      );

      tl.fromTo(
        byId("f05-toolchain-evidence"),
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" },
        6.72,
      );
    })();
  </script>
