  <script>
    (() => {
      const timeline = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["04-foundation"] = timeline;

      const titleElement = document.getElementById("f04-foundation-title");
      const cursorElement = document.getElementById("f04-foundation-cursor");
      const readoutElement = document.getElementById(
        "f04-foundation-flow-readout",
      );

      const titleStates = [
        { t: 0, text: "" },
        { t: 0.08, text: "PROD" },
        { t: 0.2, text: "PRODUCTION" },
        { t: 0.42, text: "PRODUCTION FOUND" },
        { t: 0.62, text: "PRODUCTION FOUNDAITON" },
        { t: 0.78, text: "PRODUCTION FOUNDA" },
        { t: 0.94, text: "PRODUCTION FOUNDATION" },
      ];

      const titleAt = (time) => {
        for (let index = titleStates.length - 1; index >= 0; index -= 1) {
          if (time >= titleStates[index].t) {
            return titleStates[index].text;
          }
        }
        return "";
      };

      const titleDriver = { time: 0 };
      timeline.to(
        titleDriver,
        {
          time: 1.1,
          duration: 1.1,
          ease: "none",
          onUpdate: () => {
            titleElement.textContent = titleAt(titleDriver.time);
          },
        },
        0,
      );

      const blinkDriver = { phase: 0 };
      timeline.to(
        blinkDriver,
        {
          phase: Math.PI * 4,
          duration: 1.1,
          ease: "none",
          onUpdate: () => {
            cursorElement.style.opacity =
              Math.sin(blinkDriver.phase) >= 0 ? "1" : "0";
          },
        },
        0,
      );
      timeline.to(cursorElement, { opacity: 0, duration: 0.16 }, 1.02);

      timeline.fromTo(
        "#f04-foundation-auth-card",
        { x: 260, scale: 0.96, opacity: 0 },
        {
          x: 0,
          scale: 1,
          opacity: 1,
          duration: 1.05,
          ease: "power3.out",
        },
        1,
      );
      timeline.fromTo(
        "#f04-foundation-data-card",
        { x: -260, scale: 0.96, opacity: 0 },
        {
          x: 0,
          scale: 1,
          opacity: 1,
          duration: 1.05,
          ease: "power3.out",
        },
        1.14,
      );

      timeline.fromTo(
        ["#f04-foundation-router", "#f04-foundation-server"],
        { y: 18, opacity: 0 },
        {
          y: 0,
          opacity: 1,
          duration: 0.62,
          stagger: 0.16,
          ease: "power2.out",
        },
        0.34,
      );

      const pathIds = [
        "f04-foundation-path-spine",
        "f04-foundation-path-auth",
        "f04-foundation-path-data",
      ];
      pathIds.forEach((id) => {
        const path = document.getElementById(id);
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });

      timeline.to(
        "#f04-foundation-path-spine",
        {
          strokeDashoffset: 0,
          duration: 0.68,
          ease: "power2.out",
        },
        3,
      );
      timeline.to(
        "#f04-foundation-path-auth",
        {
          strokeDashoffset: 0,
          duration: 0.72,
          ease: "power2.out",
        },
        3.52,
      );
      timeline.to(
        "#f04-foundation-path-data",
        {
          strokeDashoffset: 0,
          duration: 0.72,
          ease: "power2.out",
        },
        4.08,
      );

      timeline.fromTo(
        "#f04-foundation-flow-readout",
        { y: 10, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" },
        3,
      );
      timeline.fromTo(
        "#f04-foundation-auth-anchor",
        { scale: 0.2, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.38, ease: "power2.out" },
        4.08,
      );
      timeline.fromTo(
        "#f04-foundation-data-anchor",
        { scale: 0.2, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.38, ease: "power2.out" },
        4.64,
      );
      timeline.fromTo(
        "#f04-foundation-auth-dot",
        { scale: 0.2, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.36, ease: "power2.out" },
        4.48,
      );
      timeline.fromTo(
        "#f04-foundation-data-dot",
        { scale: 0.2, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.36, ease: "power2.out" },
        5.08,
      );

      const flowContent = [
        {
          title: "ROUTER",
          body: "route types",
          nodeId: "f04-foundation-router",
          hold: 0.18,
        },
        {
          title: "SERVER FUNCTIONS",
          body: "server boundary",
          nodeId: "f04-foundation-server",
          hold: 0.18,
        },
        {
          title: "BETTER AUTH",
          body: "identity",
          nodeId: "f04-foundation-auth-card",
          hold: 0.2,
        },
        {
          title: "DRIZZLE + POSTGRESQL",
          body: "data",
          nodeId: "f04-foundation-data-card",
          hold: 0.42,
        },
      ];

      let cumulative = 0;
      const flowSequence = flowContent.map((entry) => {
        const duration = 0.32 + entry.body.length * 0.008 + entry.hold;
        const start = cumulative;
        cumulative += duration;
        return { ...entry, start, end: cumulative };
      });

      const flowAt = (time) => {
        for (let index = flowSequence.length - 1; index >= 0; index -= 1) {
          if (time >= flowSequence[index].start) {
            return flowSequence[index];
          }
        }
        return flowSequence[0];
      };

      const flowDriver = { time: 0 };
      let lastFlowTitle = "";
      timeline.to(
        flowDriver,
        {
          time: cumulative,
          duration: 2.7,
          ease: "none",
          onUpdate: () => {
            const entry = flowAt(flowDriver.time);
            if (entry.title === lastFlowTitle) {
              return;
            }

            readoutElement.textContent = entry.title;
            flowSequence.forEach((item) => {
              document
                .getElementById(item.nodeId)
                .classList.remove("f04-foundation-node-active");
            });
            document
              .getElementById(entry.nodeId)
              .classList.add("f04-foundation-node-active");
            lastFlowTitle = entry.title;
          },
        },
        3,
      );
    })();
  </script>
